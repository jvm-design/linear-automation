name: Keep Alive

on:
  schedule:
    - cron: '0 12 1 */2 *'  # 1st of every 2 months at noon UTC

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keepalive commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive to prevent workflow disabling"
          git push
